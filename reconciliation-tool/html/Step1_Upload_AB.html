<script>
window.addEventListener('load', function () {
  RECON.wireDropZone('dz_ab_individual', 'ab_individual', maybeEnableNext);
  RECON.wireDropZone('dz_ab_policy',     'ab_policy',     maybeEnableNext);

  function maybeEnableNext() {
    var ok = RECON.state.uploads.ab_individual && RECON.state.uploads.ab_policy;
    document.getElementById('btn_step1_next').disabled = !ok;
  }

  document.getElementById('btn_step1_next').addEventListener('click', function () {
    document.getElementById('btn_step1_next').disabled = true;
    document.getElementById('btn_step1_next').textContent = 'Scanning agents…';
    RECON.serverCall('listDetectedAgents', [RECON.state.runId])
      .then(function (agents) {
        RECON.state.agents = agents || [];
        RECON.renderAgents();
        RECON.enableStep('step2', true);
        document.getElementById('step2').scrollIntoView({ behavior: 'smooth' });
      })
      .catch(function (e) {
        RECON.showError(e);
        document.getElementById('btn_step1_next').disabled = false;
        document.getElementById('btn_step1_next').textContent = 'Next: choose agents';
      });
  });
});
</script>
