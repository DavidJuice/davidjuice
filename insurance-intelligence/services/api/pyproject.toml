[project]
name = "insurance-intelligence-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "PyMuPDF>=1.24",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
